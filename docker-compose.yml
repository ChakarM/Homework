
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CONNECTION_STRING=Host=db;Port=5432;Database=app;Username=postgres;Password=1234
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: on-failure

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  backend:

volumes:
  db_data:
